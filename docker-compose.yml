services:
  dashboard:
    image: abhinay281141/ecommerce-dashboard:1.0
    container_name: ecommerce-dashboard
    ports:
      - "80:80"
    environment:
      USER_HOST: "10.0.4.84"
      PROFILE_HOST: "10.0.11.118"
      PRODUCT_HOST: "10.0.4.204"
      CART_HOST: "10.0.0.227"
      ORDER_HOST: "localhost"
      PAYMENT_HOST: "localhost"
    restart: unless-stopped